# libcamera (traitement logiciel) alloue ses images de sortie avec udmabuf, limité à
# 64 Mo par tampon. En pleine définition de la caméra arrière (5056x3792, 4 octets
# par pixel = 77 Mo), l'allocation échouait (« Failed to create dma buf ») et
# l'appareil photo de Plasma s'arrêtait (13/10/2026).
w /sys/module/udmabuf/parameters/size_limit_mb - - - - 256
