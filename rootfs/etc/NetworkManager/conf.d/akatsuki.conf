# NetworkManager sur le Xperia XZ3 (installer-networkmanager.sh)
# - Wi-Fi par iwd (déjà validé avec le firmware corrigé) plutôt que wpa_supplicant ;
# - le réseau USB (usb0, SSH depuis le PC) reste à systemd-networkd : NM n'y touche pas.
[device]
wifi.backend=iwd

[keyfile]
unmanaged-devices=interface-name:usb0
