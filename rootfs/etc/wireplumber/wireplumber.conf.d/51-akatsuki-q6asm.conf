# Xperia XZ3 : l'ADSP (q6asm) n'accepte qu'un nombre limité de tampons en attente.
# Avec les petites périodes de PipeWire (ordonnancement par minuterie), il les
# épuise : « q6asm-dai … Error queuing playback buffer -16 » (EBUSY), son haché.
# Périodes plus grandes et ordonnancement par interruptions de la carte.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size   = 1024
        api.alsa.period-num    = 4
        api.alsa.headroom      = 0
        api.alsa.disable-tsched = true
        audio.rate             = 48000
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
