# Plasma Mobile 6.7.5 : à chaque lancement, le panneau des réglages rapides écrit
# environ 3 700 lignes « QuickSettings.qml:10x: TypeError: Cannot read property …
# of undefined » (tous les réglages rapides activés sont pourtant installés : défaut
# de Plasma Mobile, 13/10/2026), plus les « WaydroidDBusClient » (Waydroid non
# installé). Ces lignes ne sont plus écrites dans le journal (moins d'écritures sur la
# carte SD) ; les vraies erreurs de plasmashell restent.
[Service]
LogFilterPatterns=~QuickSettings\.qml:[0-9]+: TypeError
LogFilterPatterns=~WaydroidDBusClient: Failed to fetch
