# Xperia XZ3 : éviter les arrêts qui traînent et les blocages définitifs.
[Manager]
# Un service qui ne s'arrête pas est tué au bout de 15 s (90 s par défaut).
DefaultTimeoutStopSec=15s
# Chien de garde matériel (s'il existe, /dev/watchdog) : si le noyau se fige,
# le téléphone redémarre seul ; et un redémarrage bloqué est forcé après 60 s.
RuntimeWatchdogSec=30s
RebootWatchdogSec=60s
